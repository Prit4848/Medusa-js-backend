name: Deploy Medusa On Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DD_HOST }}
          username: ${{ secrets.DD_USER }}
          key: ${{ secrets.DD_SSH_KEY }}
          script: |
            cd /var/www/html/medusajs

            git pull origin main

            npm install

            npm run build

            pm2 restart medusajs
